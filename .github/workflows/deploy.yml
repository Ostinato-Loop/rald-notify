name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-notify
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (notification.rald.cloud)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install

      - name: Resolve KV namespace ID via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          const h = { 'Authorization': `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces`;
          async function listAll() { const r = await fetch(`${base}?per_page=100`, { headers: h }); const d = await r.json(); if (!d.success) throw new Error(JSON.stringify(d.errors)); return d.result; }
          async function resolveId(title) {
            const all = await listAll();
            const e = all.find(n => n.title === title);
            if (e) { console.log(`  [existing] ${title}`); return e.id; }
            const r = await fetch(base, { method: 'POST', headers: h, body: JSON.stringify({ title }) });
            const d = await r.json();
            if (!d.success) { const retry = (await listAll()).find(n => n.title === title); if (retry) return retry.id; throw new Error(JSON.stringify(d.errors)); }
            console.log(`  [created]  ${title}`); return d.result.id;
          }
          (async () => {
            const RATE_LIMIT_KV = await resolveId('rald-notify-rate-limit');
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace('REPLACE_WITH_RATE_LIMIT_KV_ID', RATE_LIMIT_KV);
            fs.writeFileSync('wrangler.toml', toml);
            console.log('wrangler.toml patched.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Ensure notification.rald.cloud DNS record exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const h = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
          async function api(method, path, body) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method, headers: h, body: body ? JSON.stringify(body) : undefined
            });
            return r.json();
          }
          (async () => {
            const zones = await api('GET', '/zones?name=rald.cloud&per_page=5');
            const zone = zones.result?.[0];
            if (!zone) { console.log('WARN: rald.cloud zone not found — skipping DNS step'); return; }
            console.log(`Zone: ${zone.id} (${zone.name})`);
            const existing = await api('GET', `/zones/${zone.id}/dns_records?name=notification.rald.cloud`);
            if (existing.result?.length > 0) {
              console.log('notification.rald.cloud DNS already exists:', existing.result.map(r => `${r.type} ${r.content} proxied=${r.proxied}`).join(', '));
              return;
            }
            // Create proxied AAAA 100:: — Cloudflare Workers route dummy record
            const r = await api('POST', `/zones/${zone.id}/dns_records`, {
              type: 'AAAA', name: 'notification', content: '100::', proxied: true,
              comment: 'Cloudflare Worker route — rald-notify (notification.rald.cloud)'
            });
            if (r.success) {
              console.log('Created notification.rald.cloud AAAA 100:: (proxied)');
            } else {
              console.error('DNS record creation failed:', JSON.stringify(r.errors));
            }
          })().catch(e => { console.error('[WARN] DNS step error:', e.message); });
          JSEOF

      - name: Deploy rald-notify Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push SUPABASE_SERVICE_ROLE_KEY to worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "FATAL: SUPABASE_SERVICE_ROLE_KEY not set" && exit 1; fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name rald-notify
          echo "SUPABASE_SERVICE_ROLE_KEY pushed to rald-notify"

      - name: Push RALD_JWT_SECRET to worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          if [ -z "$RALD_JWT_SECRET" ]; then
            echo "WARNING: RALD_JWT_SECRET not set — add to org secrets to complete setup"
          else
            echo "$RALD_JWT_SECRET" | npx wrangler secret put RALD_JWT_SECRET --name rald-notify
            echo "RALD_JWT_SECRET pushed to rald-notify"
          fi

      - name: Push RESEND_API_KEY to worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --name rald-notify && echo "pushed"; fi

      - name: Push TERMII_API_KEY to worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
        run: |
          if [ -n "$TERMII_API_KEY" ]; then echo "$TERMII_API_KEY" | npx wrangler secret put TERMII_API_KEY --name rald-notify && echo "pushed"; fi

      - name: Push VAPID secrets to worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          if [ -n "$VAPID_PUBLIC_KEY" ]; then
            echo "$VAPID_PUBLIC_KEY"  | npx wrangler secret put VAPID_PUBLIC_KEY  --name rald-notify
            echo "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY --name rald-notify
            echo "$VAPID_SUBJECT"     | npx wrangler secret put VAPID_SUBJECT     --name rald-notify
            echo "VAPID pushed"
          fi
