name = "rald-notify"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "rald-notify"
SERVICE_VERSION = "1.0.0"

[[routes]]
pattern = "notification.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

[observability]
enabled = true
head_sampling_rate = 1

# Cron trigger disabled — register manually via Cloudflare dashboard if needed:
# Scheduled Functions > notification.rald.cloud > Add Cron Trigger > */5 * * * *

# Secrets pushed by deploy.yml via wrangler secret put:
#   SUPABASE_URL (org), SUPABASE_SERVICE_ROLE_KEY (org)
#   RALD_JWT_SECRET, RESEND_API_KEY (optional: TERMII_API_KEY, VAPID_*)
