name = "rald-notify"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "development"
SERVICE_NAME = "rald-notify"
SERVICE_VERSION = "1.0.0"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "placeholder-replace-with-actual-kv-id"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Secrets — set via: wrangler secret put <NAME>
# Required:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   RALD_JWT_SECRET
#   RESEND_API_KEY
#   TERMII_API_KEY
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT
# Optional:
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER

[env.production]
name = "rald-notify"
vars = { ENVIRONMENT = "production" }

[[env.production.routes]]
pattern = "notification.rald.cloud/*"
zone_name = "rald.cloud"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_PRODUCTION_KV_ID"
