name = "rald-notify"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "rald-notify"
SERVICE_VERSION = "1.0.0"

[[routes]]
pattern = "notification.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Secrets — pushed via deploy.yml using: wrangler secret put <NAME>
# Required:
#   SUPABASE_URL (org secret)
#   SUPABASE_SERVICE_ROLE_KEY (org secret)
#   RALD_JWT_SECRET
#   RESEND_API_KEY
# Optional:
#   TERMII_API_KEY
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
