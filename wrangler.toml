name = "rald-notify"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "rald-notify"
SERVICE_VERSION = "1.1.0"
SUPABASE_URL = "https://onxdcikfttdmnhofsuwo.supabase.co"

[[routes]]
pattern = "notification.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "f54f9248247a428bb4e54ddfc1e2c832"

# [triggers] crons = ["*/5 * * * *"]
# NOTE: cron triggers require 'Workers Scripts:Edit' + 'Scheduled Tasks:Edit' API token scope.
# Add via Cloudflare Dashboard → Workers & Pages → rald-notify → Triggers → Cron Triggers.

[observability]
enabled = true
head_sampling_rate = 1

# Secrets pushed by deploy.yml via wrangler secret put:
#   SUPABASE_SERVICE_ROLE_KEY (org)
#   RALD_JWT_SECRET, RESEND_API_KEY (optional: TERMII_API_KEY, VAPID_*)
#   OPEN_OBSERVE_API_KEY, OPEN_OBSERVE_ENDPOINT (observability)
